name: Sync to Cloudflare R2

on:
  push:
    branches: [master, main]
    paths:
      - '100days.ics'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload to R2
        env:
          AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          aws s3 cp 100days.ics s3://${{ secrets.R2_BUCKET }}/100days.ics \
            --endpoint-url $AWS_ENDPOINT_URL \
            --content-type "text/calendar; charset=utf-8" \
            --cache-control "public, max-age=3600"
          echo "✅ Uploaded successfully to https://s4.03-a.org/100days.ics"